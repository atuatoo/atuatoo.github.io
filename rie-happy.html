<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#ff6f91">
  <title>りえちゃんを満足させろ！</title>
  <meta name="description" content="架空の成人・りえちゃんの本音を読み取り、7日間で満足度を上げる選択ゲーム。">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JBQZ5L4VN6"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-JBQZ5L4VN6');</script>
  <style>
    :root{--pink:#ff6f91;--cream:#fff8ef;--ink:#30242a;--yellow:#ffd466;--green:#49b88a;--red:#ee476f}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;min-height:100%;background:linear-gradient(145deg,#fff1db,#ffe2eb);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer}.app{min-height:100dvh;max-width:650px;margin:auto;padding:max(14px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.brand{font-weight:1000;font-size:17px;letter-spacing:-1px}.brand b{color:var(--pink)}.day{font-size:11px;font-weight:900;color:#8d737d}.meter{height:14px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;box-shadow:0 3px 0 #30242a22}.meter i{display:block;width:35%;height:100%;background:linear-gradient(90deg,var(--yellow),var(--pink));transition:.45s}.scene{position:relative;margin-top:10px;min-height:560px;border:3px solid var(--ink);border-radius:27px;background:var(--cream);overflow:hidden;box-shadow:0 13px 0 #30242a}.room{height:220px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#bce9ff 0 65%,#dcbd93 65%);font-size:92px;position:relative}.room:after{content:"";position:absolute;left:9%;top:20%;width:65px;height:65px;background:#fff8;border:8px solid #906f61;border-radius:4px}.face{position:relative;z-index:2;filter:drop-shadow(0 8px 4px #0003);transition:.25s}.heart{position:absolute;font-size:22px;animation:float 1.2s forwards;pointer-events:none}.card{padding:18px}.speech{min-height:76px;padding:13px 15px;border:2px solid var(--ink);border-radius:17px;background:white;font-size:15px;font-weight:850;line-height:1.55;position:relative}.speech:before{content:"";position:absolute;top:-12px;left:50%;width:20px;height:20px;background:#fff;border-left:2px solid var(--ink);border-top:2px solid var(--ink);transform:rotate(45deg)}.hint{margin:10px 2px 8px;color:#987984;font-size:11px;font-weight:800}.choices{display:grid;gap:9px}.choice{border:2px solid var(--ink);border-radius:15px;background:#fff;padding:13px 12px;text-align:left;font-weight:900;box-shadow:0 4px 0 var(--ink);transition:.08s}.choice:active{transform:translateY(4px);box-shadow:none}.choice small{display:block;margin-top:3px;color:#947b84;font-size:10px}.status{display:flex;justify-content:space-between;margin-top:13px;font-size:11px;font-weight:900}.combo{color:var(--pink)}.panel{position:absolute;z-index:10;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px;background:#fff8eff5;backdrop-filter:blur(8px)}[hidden]{display:none!important}.eyebrow{margin:0 0 8px;color:var(--pink);font-size:10px;font-weight:1000;letter-spacing:3px}.panel h1,.panel h2{margin:0;font-size:clamp(39px,12vw,70px);line-height:.92;letter-spacing:-4px}.panel h1 b{display:block;margin-top:12px;font-size:.36em;letter-spacing:1px;color:var(--pink)}.desc{margin:17px 0;color:#79646c;font-size:13px;line-height:1.8;font-weight:750}.primary{border:2px solid var(--ink);border-radius:99px;background:var(--pink);color:#fff;padding:15px 26px;min-width:225px;font-weight:1000;box-shadow:0 6px 0 var(--ink)}.primary:active{transform:translateY(6px);box-shadow:none}.best{margin-top:16px;font-size:11px;font-weight:900;color:#8d737d}.resultEmoji{font-size:76px}.score{font-size:72px;font-weight:1000;color:var(--pink);line-height:1}.memory{margin:10px 0 0;padding:9px 12px;border-radius:12px;background:#ffe1e9;font-size:11px;font-weight:900}.flash{animation:flash .28s}.shake{animation:shake .3s}@keyframes float{to{transform:translateY(-80px);opacity:0}}@keyframes flash{50%{background:#fff2a8}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}@media(max-height:700px){.room{height:170px}.scene{min-height:500px}.face{font-size:70px}.card{padding:13px}.speech{min-height:65px}.choice{padding:9px 11px}}
  </style>
</head>
<body><main class="app">
  <div class="top"><div class="brand">りえちゃんを<b>満足させろ！</b></div><div class="day" id="day">DAY 1 / 7</div></div>
  <div class="meter"><i id="bar"></i></div>
  <section class="scene" id="scene">
    <div class="room"><div class="face" id="face">👩</div></div>
    <div class="card">
      <div class="speech" id="speech">今日はなんだか疲れたなあ……</div>
      <div class="memory" id="memory">本音メモ：まだ何も分からない</div>
      <div class="hint">空気を読んで、いちばん喜ぶ行動を選べ</div>
      <div class="choices" id="choices"></div>
      <div class="status"><span>満足度 <b id="happy">35</b>%</span><span class="combo" id="combo">連続正解 ×0</span></div>
    </div>
    <div class="panel" id="intro">
      <p class="eyebrow">7 DAYS CHALLENGE</p><h1>りえちゃんを<br>満足させろ！<b>架空の成人が登場する選択ゲーム</b></h1>
      <p class="desc">口だけでは通用しない。<br>会話を覚え、家事をこなし、最高の休日を作れ。<br>りえちゃんの好みはプレイするたびに変わる。</p>
      <button class="primary" id="start">7日間を始める</button><div class="best" id="bestTop">BEST 0点</div>
    </div>
    <div class="panel" id="ending" hidden>
      <p class="eyebrow">7 DAYS RESULT</p><div class="resultEmoji" id="resultEmoji">😊</div><h2 id="resultTitle">まずまず。</h2>
      <div class="score"><span id="score">0</span><small>点</small></div><p class="desc" id="resultText"></p>
      <button class="primary" id="again">もう一度挑戦</button><div class="best" id="bestEnd"></div>
    </div>
  </section>
</main><script>
(()=>{
const $=id=>document.getElementById(id), profiles=[
 {key:'calm',name:'静かに休みたい',memo:'疲れた日は静かに過ごしたい',emoji:'😌'},
 {key:'talk',name:'話を聞いてほしい',memo:'アドバイスより共感が好き',emoji:'😊'},
 {key:'active',name:'外へ出たい',memo:'休日は家より外が好き',emoji:'🤩'},
 {key:'food',name:'おいしい物が好き',memo:'甘い物と新しい店に弱い',emoji:'😋'}
], rounds={
 calm:[['今日はなんだか疲れたなあ……',['そっとお茶を入れて休ませる','原因を細かく質問する','今すぐ買い物へ誘う']],
       ['部屋が少し散らかってるね',['黙って片づけを始める','気にしないと言う','掃除のやり方を説明する']]],
 talk:[['今日ちょっと嫌なことがあって……',['スマホを置いて最後まで聞く','すぐ解決策を3つ出す','話題を変えて笑わせる']],
       ['この服、どう思う？',['似合う部分を具体的に伝える','何でもいいと答える','値段を聞く']]],
 active:[['明日は予定ないね',['行きたがっていた場所を提案する','一日中ゲームをすると宣言','予定を全部任せる']],
         ['天気がいいね',['近所を一緒に散歩する','カーテンを閉める','天気予報だけ見る']]],
 food:[['ちょっと小腹がすいたな',['好きそうな物を一緒に選ぶ','水を飲めばと言う','自分の分だけ注文する']],
       ['新しいお店ができたみたい',['予約して一緒に行く','口コミだけ読んで終わる','いつもの店を押し通す']]]
};
let state;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function begin(){const profile=profiles[Math.floor(Math.random()*profiles.length)];state={day:1,happy:35,score:0,combo:0,profile,known:false};$('intro').hidden=true;$('ending').hidden=true;render();gtag?.('event','game_start',{game_name:'rie_happy'})}function makeRound(){let source=rounds[state.profile.key];let base=source[(state.day-1)%source.length];let options=base[1].map((text,i)=>({text,good:i===0}));if(state.day===3)return {q:'私が疲れたとき、どうしてほしいと思う？',options:shuffle([{text:state.profile.memo,good:true},{text:'とにかく放っておく',good:false},{text:'すぐに正論を言う',good:false}])};if(state.day===6)return {q:'今度の休日、何を優先する？',options:shuffle([{text:state.profile.name,good:true},{text:'自分の予定だけ',good:false},{text:'何も考えず当日に決める',good:false}])};return {q:base[0],options:shuffle(options)}}function render(){let r=makeRound();state.current=r;$('day').textContent='DAY '+state.day+' / 7';$('speech').textContent=r.q;$('happy').textContent=Math.max(0,Math.min(100,state.happy));$('bar').style.width=Math.max(3,Math.min(100,state.happy))+'%';$('combo').textContent='連続正解 ×'+state.combo;$('memory').textContent='本音メモ：'+(state.known?state.profile.memo:'まだ何も分からない');$('choices').innerHTML=r.options.map((o,i)=>`<button class="choice" data-i="${i}">${o.text}<small>${state.day>=5?'よく考えて選ぼう':'タップして決定'}</small></button>`).join('')}
$('choices').onclick=e=>{const b=e.target.closest('.choice');if(!b)return;[...$('choices').children].forEach(x=>x.disabled=true);const good=state.current.options[+b.dataset.i].good;if(good){state.combo++;let gain=10+Math.min(10,state.combo*2);state.happy+=gain;state.score+=100+state.combo*30;$('face').textContent=state.profile.emoji;$('scene').classList.add('flash');pop('💖');if(state.day===1)state.known=true;$('speech').textContent=state.day===3?'覚えてくれてたんだ！':'うれしい。ありがとう！'}else{state.combo=0;state.happy-=14;state.score=Math.max(0,state.score-40);$('face').textContent='😑';$('scene').classList.add('shake');$('speech').textContent='うーん、それじゃないかも……'}navigator.vibrate?.(good?40:180);setTimeout(()=>{$('scene').classList.remove('flash','shake');if(state.day++>=7)finish();else render()},900)};
function pop(t){const h=document.createElement('span');h.className='heart';h.textContent=t;h.style.left=(35+Math.random()*30)+'%';h.style.top='115px';document.querySelector('.room').appendChild(h);setTimeout(()=>h.remove(),1200)}function finish(){const total=state.score+state.happy*5;let title='まだ修行中。',icon='😅',text='本音をもう少し覚えよう。次は違う好みになるかも。';if(state.happy>=90){title='最高の7日間！';icon='🥰';text='気づかいも記憶力も完璧。りえちゃんは大満足！'}else if(state.happy>=65){title='かなり満足！';icon='😊';text='いい調子。あと一歩で完璧な一週間だった。'}else if(state.happy<35){title='空気を読め！';icon='😤';text='自分本位な選択が多かった。もう一度挑戦しよう。'}const best=Math.max(+(localStorage.rieHappyBest||0),total);localStorage.rieHappyBest=best;$('score').textContent=total;$('resultTitle').textContent=title;$('resultEmoji').textContent=icon;$('resultText').textContent=text;$('bestEnd').textContent='BEST '+best+'点';$('ending').hidden=false;gtag?.('event','game_complete',{game_name:'rie_happy',score:total,happiness:state.happy})}function updateBest(){$('bestTop').textContent='BEST '+(localStorage.rieHappyBest||0)+'点'}$('start').onclick=begin;$('again').onclick=()=>{updateBest();begin()};updateBest();
})();
</script></body></html>
