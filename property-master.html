translate:7px}}@media(max-height:740px){.visual{height:165px}.game{min-height:565px}.building{font-size:80px}.info{padding:8px}.cell{padding:5px}.risk{margin:6px 0}.actions{padding-bottom:8px}.panel h1,.panel h2{font-size:42px}}</style></head><body><main class="app"><div class="top"><div class="brand">価値ある<b>不動産を見極めろ！</b></div><div class="round" id="round">1 / 10物件</div></div><div class="stats"><div class="stat"><small>投資資金</small><b id="cash">10,000万</b></div><div class="stat"><small>調査力</small><b id="research">100</b></div><div class="stat"><small>暫定利益</small><b id="profit">0万</b></div></div><section class="game" id="game"><div class="visual"><div class="badge" id="type">中古戸建</div><div class="building" id="building">🏠</div><div class="price" id="price">3,500万円</div></div><div class="info"><h2 id="name">大阪郊外の戸建</h2><div class="grid" id="grid"></div><div class="risk" id="risk">売主：特に問題はありません！</div></div><button class="inspect" id="inspect">🔍 重要事項を調査する（調査力−15）</button><div class="actions"><button class="act buy" data-choice="buy">購入</button><button class="act offer" data-choice="offer">20%指値</button><button class="act pass" data-choice="pass">見送る</button></div><div class="log" id="log">表面情報だけで判断する？それとも調査する？</div><div class="panel" id="intro"><p class="eyebrow">REAL ESTATE INVESTOR</p><h1>価値ある不動産を<br>見極めろ！<b>10物件から割安物件だけを買え</b></h1><p class="desc">築年数・駅距離・構造・土地・延床・利回りだけでは決まらない。<br>接道、権利、再建築、修繕、災害リスクを調査しよう。<br>調査力は有限。全部は調べられない。</p><button class="primary" id="start">投資を始める</button><div class="best" id="bestTop">BEST 0点</div></div><div class="panel" id="ending" hidden><p class="eyebrow">PORTFOLIO RESULT</p><div class="resultIcon" id="resultIcon">🏙️</div><h2 id="resultTitle">査定終了</h2><div class="score" id="score">0点</div><div class="breakdown" id="breakdown"></div><button class="primary" id="again">別の10物件に挑戦</button><div class="best" id="bestEnd"></div></div></section></main><script>

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function value(p){let v=p.base-p.penalty;if(p.age>35&&p.structure==='木造')v-=300;if(p.loc.includes('駅3分')||p.loc.includes('駅4分')||p.loc.includes('駅前'))v+=400;if(p.land>200)v+=250;return Math.max(100,v)}function begin(){s={list:shuffle(base).slice(0,10),i:0,cash:10000,research:100,profit:0,history:[],inspected:false};$('intro').hidden=true;$('ending').hidden=true;show();gtag?.('event','game_start',{game_name:'property_master'})}function show(){const p=s.list[s.i];s.inspected=false;$('round').textContent=(s.i+1)+' / 10物件';$('type').textContent=p.type;$('building').textContent=p.icon;$('price').textContent=p.price.toLocaleString()+'万円';$('name').textContent=p.name;$('grid').innerHTML=`<div class="cell"><small>立地</small><b>${p.loc}</b></div><div class="cell"><small>築年数・構造</small><b>築${p.age}年・${p.structure}</b></div><div class="cell"><small>土地／延床</small><b>${p.land||'—'}㎡／${p.floor}㎡</b></div><div class="cell"><small>表面利回り</small><b>${p.yield?p.yield+'%':'収益なし'}</b></div><div class="cell"><small>接道</small><b>${p.road}</b></div><div class="cell"><small>権利</small><b>${p.right}</b></div>`;$('risk').textContent='売主説明：大きな問題はありません';$('inspect').disabled=s.research<15;$('inspect').textContent=s.research<15?'調査力不足':'🔍 重要事項を調査する（調査力−15）';$('log').textContent='価格は適正か？隠れた問題はないか？';stats()}
function stats(){$('cash').textContent=s.cash.toLocaleString()+'万';$('research').textContent=s.research;$('profit').textContent=(s.profit>=0?'+':'')+Math.round(s.profit).toLocaleString()+'万'}$('inspect').onclick=()=>{if(s.inspected||s.research<15)return;s.research-=15;s.inspected=true;const p=s.list[s.i];$('risk').innerHTML='<b>調査結果：</b>'+p.risk;$('inspect').disabled=true;$('inspect').textContent='調査済み';$('log').textContent=p.penalty>0?'要注意。適正価値への影響を考えよう':'重大な問題は見つからなかった';stats()};document.querySelector('.actions').onclick=e=>{const b=e.target.closest('[data-choice]');if(!b)return;decide(b.dataset.choice)};
function decide(choice){const p=s.list[s.i],fair=value(p),deal=choice==='offer'?Math.round(p.price*.8):p.price;let gain=0,label='見送り';if(choice!=='pass'){if(deal>s.cash){flash('資金不足で買えない！',false);return}s.cash-=deal;gain=fair-deal;s.profit+=gain;label=choice==='offer'?'20%指値':'購入'}else{gain=p.price<fair?-(fair-p.price)*.35:Math.min(250,p.price-fair)*.2;s.profit+=gain}const correct=(choice==='pass'&&p.price>=fair)||(choice!=='pass'&&deal<fair);s.history.push(`${p.name}｜${label}｜適正${fair.toLocaleString()}万｜${gain>=0?'+':''}${Math.round(gain)}万`);flash(`${correct?'好判断！':'判断ミス'} 適正価格は約${fair.toLocaleString()}万円`,correct);setTimeout(()=>{if(++s.i>=s.list.length)finish();else show()},900)}function flash(t,good){$('log').textContent=t;$('game').classList.add(good?'good':'bad');navigator.vibrate?.(good?35:160);setTimeout(()=>$('game').classList.remove('good','bad'),350)}function finish(){const score=Math.max(0,Math.round(1000+s.profit+s.research*5));let title='まだ修行中',icon='😵‍💫';if(score>=3500){title='伝説の不動産投資家';icon='🏆🏙️'}else if(score>=2200){title='目利き投資家';icon='😎🏢'}else if(score>=1200){title='堅実な大家';icon='🙂🏠'}const best=Math.max(+(localStorage.propertyMasterBest||0),score);localStorage.propertyMasterBest=best;$('resultTitle').textContent=title;$('resultIcon').textContent=icon;$('score').textContent=score.toLocaleString()+'点';$('breakdown').innerHTML=s.history.map(x=>'<div>・'+x+'</div>').join('');$('bestEnd').textContent='BEST '+best.toLocaleString()+'点';$('ending').hidden=false;gtag?.('event','game_complete',{game_name:'property_master',score,profit:Math.round(s.profit)})}function best(){$('bestTop').textContent='BEST '+(+(localStorage.propertyMasterBest||0)).toLocaleString()+'点'}$('start').onclick=begin;$('again').onclick=()=>{best();begin()};best()})();
