ion:relative;z-index:2;font-size:98px;filter:drop-shadow(0 9px 4px #0005)}.year{position:absolute;left:12px;top:12px;padding:7px 10px;border-radius:99px;background:#10172bdd;color:#fff;font-size:10px;font-weight:1000}.eventIcon{position:absolute;right:12%;top:20%;font-size:52px;animation:float 1s alternate infinite}.content{padding:15px}.category{color:#2975ba;font-size:9px;font-weight:1000;letter-spacing:2px}.content h2{margin:5px 0 7px;font-size:23px;line-height:1.2}.story{min-height:58px;margin:0 0 11px;color:#66728b;font-size:12px;font-weight:750;line-height:1.6}.choices{display:grid;gap:8px}.choice{border:2px solid var(--ink);border-radius:14px;background:#fff;padding:12px;text-align:left;font-size:13px;font-weight:950;box-shadow:0 4px 0 var(--ink)}.choice:active{translate:0 4px;box-shadow:none}.choice small{display:block;margin-top:3px;color:#79859a;font-size:9px}.lesson{margin-top:11px;padding:10px;border-left:5px solid var(--yellow);border-radius:8px;background:#fff3bf;font-size:10px;font-weight:850;line-height:1.55;min-height:45px}.next{display:block;width:100%;margin-top:9px;padding:11px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:1000}.panel{position:absolute;z-index:20;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px;background:#f4f7fbf7;backdrop-filter:blur(8px)}[hidden]{display:none!important}.eyebrow{margin:0 0 8px;color:#287bca;font-size:10px;font-weight:1000;letter-spacing:3px}.panel h1,.panel h2{margin:0;font-size:clamp(40px,12vw,70px);line-height:.9;letter-spacing:-4px}.panel h1 b{display:block;margin-top:13px;color:var(--red);font-size:.35em;letter-spacing:1px}.desc{margin:18px 0;color:#65728b;font-size:12px;font-weight:800;line-height:1.8}.primary{min-width:230px;padding:15px 25px;border:2px solid var(--ink);border-radius:99px;background:var(--yellow);font-weight:1000;box-shadow:0 6px 0 var(--ink)}.primary:active{translate:0 6px;box-shadow:none}.scor id="score">0分</div><div class="endingStats" id="endingStats"></div><p class="desc" id="resultText"></p><button class="primary" id="again">重新选择人生</button><div class="best" id="bestEnd"></div></div></section></main><script>
(()=>{const $=id=>document.getElementById(id),events=[
{cat:'网络安全',icon:'🎮',title:'免费的游戏点券？',story:'Ryan收到一条私信：“点击链接登录，就送10000点券。”页面看起来和官方网站一模一样。',lesson:'钓鱼网站会模仿官方网站。不要从私信链接登录，应自己打开官方应用，并开启两步验证。',c:[['点击链接，马上登录',{money:-2500,trust:-20},'账号和支付信息被盗了！'],['自己打开官方应用核实',{skill:12,trust:8},'你发现官方根本没有这个活动。'],['把链接转发给朋友问问',{trust:-8},'危险链接被继续传播。']]},
{cat:'金钱管理',icon:'💰',title:'第一笔兼职收入',story:'Ryan赚到3000元。他想买新耳机，也担心以后突然需要钱。',lesson:'可以先存下20%作为应急金，再安排必要支出和娱乐。先储蓄，再消费。',c:[['全部买游戏和耳机',{money:-2500,health:3},'很开心，但几乎没有应急资金。'],['先存600元，再计划消费',{money:2400,skill:10,trust:5},'你建立了第一笔应急金。'],['把钱全部藏在家里',{money:3000,skill:-2},'没有损失，但也没有规划。']]},
{cat:'投资常识',icon:'📈',title:'保证翻倍的投资群',story:'群主说：“零风险，一个月翻倍，名额只剩三个。”朋友已经准备转账。',lesson:'高收益、零风险、催促转账，是投资诈骗的典型信号。投资前要查牌照、产品和风险。',c:[['怕错过机会，立刻投入',{money:-3000,trust:-10},'群主收款后消失了。'],['查监管信息并拒绝',{skill:15,trust:8},'查不到任何合法登记，你避开了骗局。'],['借钱投入，赚了再还',{money:-4000,trust:-20},'投资亏损还留下债务。']]},
{cat:'复利',icon:'🌱',title:'每月储蓄还是以后再说？',story:'Ryan每月可以留下200元。朋友说金额太小，不如长大后一次存很多。',lesson:'复利需要时间。小额、长期、规律投入，通常比很晚才开始更有优势。',c:[['现在开始长期储蓄',{money:1200,skill:12},'时间成为你的朋友。'],['等收入高了再开始',{money:400},'你失去了最宝贵的时间。'],['追涨热门资产',{money:-500,skill:-3},'没有计划的追涨容易高买低卖。']]},
{cat:'合同',icon:'📝',title:'高薪兼职合同',story:'店长催Ryan马上签字：“大家都这样，没时间看细节。”合同里有很多小字。',lesson:'签字前必须确认工资、工时、违约责任、个人信息用途，并保留合同副本。',c:[['不看就签',{money:800,trust:-12,health:-8},'隐藏条款让你无偿加班。'],['逐条阅读并提出问题',{skill:14,trust:10,money:1200},'你删除了不合理条款。'],['拍照但还是直接签',{skill:3,health:-5},'留下证据有用，但风险仍然存在。']]},
{cat:'信用与借贷',icon:'💳',title:'先买后付的新手机',story:'只要每月付一点，Ryan现在就能拿到最新手机，但总还款额比原价高35%。',lesson:'分期要看总成本、利率和逾期费用，而不是只看每月金额。',c:[['只看月供，马上购买',{money:-2200,trust:-10},'月供很小，总成本却很高。'],['计算总价后继续用旧手机',{money:800,skill:12,trust:8},'你避免了不必要的债务。'],['借朋友的钱购买',{money:-1500,trust:-15},'债务影响了朋友关系。']]},
{cat:'健康',icon:'🌙',title:'考试前通宵？',story:'明天有重要考试。Ryan还有很多没复习，已经连续几天睡眠不足。',lesson:'睡眠帮助记忆巩固。长期熬夜会降低注意力、情绪和学习效率。',c:[['喝能量饮料通宵',{skill:5,health:-22},'短期多看了一点，考试时却无法集中。'],['整理重点后睡足7小时',{skill:12,health:14},'记忆和判断力都更稳定。'],['直接放弃复习玩手机',{skill:-10,health:4},'休息了，但没有解决问题。']]},
{cat:'职业规划',icon:'🧭',title:'选择未来方向',story:'Ryan不知道自己适合什么。学校提供一次职业体验，也可以在家刷短视频。',lesson:'职业选择不是一次决定。通过体验、访谈和小项目，可以低成本了解自己的兴趣与能力。',c:[['参加职业体验并记录感受',{skill:18,trust:8},'你发现了自己擅长解决问题。'],['只看“高薪职业排行”',{skill:3},'收入重要，但不能替代实际了解。'],['什么都不做，等以后再说',{skill:-6},'选择被不断推迟。']]},
{cat:'SNS与隐私',icon:'📍',title:'晒出实时位置',story:'Ryan在旅行，想发布带有学校、住址和实时位置的照片。',lesson:'实时位置、校服、门牌和固定路线可能暴露个人信息。回家后再发布更安全。',c:[['马上公开全部信息',{trust:-20,health:-8},'陌生人知道了你的实时位置。'],['回家后发布并隐藏隐私',{skill:12,trust:8},'你分享了快乐，也保护了自己。'],['只对刚认识的网友可见',{trust:-10},'“仅好友”不等于绝对安全。']]},
{cat:'风险管理',icon:'🛡️',title:'突发的电脑故障',story:'学习用电脑突然坏了，维修需要1800元。三天后必须提交重要作品。',lesson:'应急金用于不可预见但必要的支出。通常先建立基本应急储备，再考虑高风险投资。',c:[['用应急金维修',{money:-1800,skill:10,trust:5},'储备金发挥了作用。'],['借高息网贷维修',{money:-2800,trust:-18},'解决眼前问题，却制造了更大压力。'],['隐瞒情况，不提交作品',{skill:-12,trust:-15},'不沟通让问题更严重。']]},
{cat:'投资组合',icon:'🧺',title:'把钱全部押在一家公司？',story:'Ryan非常看好一家热门公司。有人建议把全部储蓄都买进去。',lesson:'分散投资不能消除风险，但可避免单一资产失败造成毁灭性损失。不要投资自己不理解的产品。',c:[['全部押注热门公司',{money:-900,skill:-3},'公司暴跌，损失很大。'],['分散并保留现金',{money:900,skill:14},'收益不夸张，但风险更可控。'],['完全听网红买卖',{money:-1200,trust:-5},'别人的目标和风险承受力不等于你的。']]},
{cat:'人际与责任',icon:'🤝',title:'朋友来借钱',story:'朋友说家里有急事，想借Ryan一大笔钱，但不愿说明还款时间。',lesson:'帮助别人也要设边界。只借自己承受得起损失的钱，并写明金额、用途和还款安排。',c:[['把全部储蓄借出',{money:-2200,trust:5},'善意很重要，但你失去了自己的安全垫。'],['了解情况并写清约定',{money:-600,trust:15,skill:8},'你既提供帮助，也保护双方关系。'],['在班里公开朋友的困难',{trust:-25},'隐私被泄露，关系破裂。']]},
{cat:'信息判断',icon:'🧠',title:'震惊！明天开始全面停课？',story:'一张没有来源的截图在群里疯传，大家都准备转发。',lesson:'核实信息要看原始来源、发布日期、官方渠道和多家可靠报道，截图本身不是证据。',c:[['加上“听说”后转发',{trust:-15},'加上“听说”也会传播谣言。'],['搜索官方通知和原始来源',{skill:15,trust:12},'你发现这是两年前的旧消息。'],['只看评论区判断真假',{skill:-3},'评论数量不代表真实性。']]}
];let s;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function begin(){s={list:shuffle(events).slice(0,12),i:0,money:5000,skill:30,health:80,trust:50,answered:false};$('intro').hidden=true;$('ending').hidden=true;show();gtag?.('event','game_start',{game_name:'ryan_future_cn'})}function clamp(){for(const k of ['skill','health','trust'])s[k]=Math.max(0,Math.min(100,s[k]));s.money=Math.max(-5000,s.money)}function stats(){$('money').textContent='¥'+s.money.toLocaleString();$('skill').textContent=s.skill;$('health').textContent=s.health;$('trust').textContent=s.trust}function show(){const e=s.list[s.i];s.answered=false;$('stage').textContent='事件 '+(s.i+1)+' / 12';$('year').textContent=(15+Math.floor(s.i/4))+'岁・未来第'+(1+Math.floor(s.i/4))+'年';$('eventIcon').textContent=e.icon;$('category').textContent=e.cat;$('title').textContent=e.title;$('story').textContent=e.story;$('lesson').textContent='做出选择后，会显示真正有用的知识。';$('next').hidden=true;$('choices').innerHTML=shuffle(e.c).map((c,i)=>`<button class="choice" data-text="${encodeURIComponent(c[0])}">${c[0]}<small>点击做出决定</small></button>`).join('');stats()}$('choices').onclick=e=>{const b=e.target.closest('.choice');if(!b||s.answered)return;s.answered=true;const ev=s.list[s.i],text=decodeURIComponent(b.dataset.text),c=ev.c.find(x=>x[0]===text),delta=c[1];for(const [k,v] of Object.entries(delta))s[k]+=v;clamp();stats();[...$('choices').children].forEach(x=>x.disabled=true);const quality=(delta.skill||0)+(delta.trust||0)+(delta.health||0)+(delta.money||0)/200;$('ryan').textContent=quality>=8?'😎':quality<0?'😰':'🤔';$('lesson').innerHTML='<b>结果：</b>'+c[2]+'<br><b>未来知识：</b>'+ev.lesson;$('game').classList.add(quality>=0?'good':'bad');navigator.vibrate?.(quality>=0?35:140);setTimeout(()=>$('game').classList.remove('good','bad'),350);$('next').hidden=false};$('next').onclick=()=>{if(++s.i>=s.list.length)finish();else{$('ryan').textContent='🧑🏻‍💻';show()}};function finish(){const score=Math.max(0,Math.round(s.money/10+s.skill*12+s.health*8+s.trust*10));let title='未来需要重新规划',icon='🧩',text='失败不是终点。重新选择，看看哪些决定会带来长期影响。';if(score>=3000){title='未来城市领航者';icon='🚀🏆';text='你能保护自己，也懂得规划金钱、健康和能力。'}else if(score>=2200){title='可靠的未来开拓者';icon='😎🧭';text='你的基础很扎实，再加强几个薄弱领域就更好了。'}else if(score>=1400){title='成长中的挑战者';icon='🌱';text='你已经学会不少，但冲动选择仍会影响未来。'}const best=Math.max(+(localStorage.ryanFutureBest||0),score);localStorage.ryanFutureBest=best;$('resultTitle').textContent=title;$('resultIcon').textContent=icon;$('score').textContent=score.toLocaleString()+'分';$('endingStats').textContent=`资金 ¥${s.money.toLocaleString()}｜能力 ${s.skill}｜健康 ${s.health}｜信用 ${s.trust}`;$('resultText').textContent=text;$('bestEnd').textContent='最高纪录：'+best.toLocaleString()+'分';$('ending').hidden=false;gtag?.('event','game_complete',{game_name:'ryan_future_cn',score})}function best(){$('bestTop').textContent='最高纪录：'+(+(localStorage.ryanFutureBest||0)).toLocaleString()+'分'}$('start').onclick=begin;$('again').onclick=()=>{best();begin()};best()})();
