<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#183d32"><title>キャンプ場を完成させろ！</title><meta name="description" content="予算と時間内にBBQと宿泊準備を完成させるキャンプゲーム。">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JBQZ5L4VN6"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-JBQZ5L4VN6');</script>
<style>:root{--forest:#183d32;--leaf:#3d7551;--sun:#ffca55;--cream:#fff7e5;--ink:#17241e;--red:#ef5b4f}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#b9d8b0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:var(--ink)}button{font:inherit}.app{min-height:100dvh;max-width:680px;margin:auto;padding:max(10px,env(safe-area-inset-top)) 10px max(14px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto 1fr;gap:8px}.top{display:flex;align-items:center;justify-content:space-between;color:#fff}.brand{font-weight:1000;letter-spacing:-1px}.brand b{color:var(--sun)}.weather{font-size:12px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:7px 5px;border:2px solid var(--ink);border-radius:11px;background:var(--cream);text-align:center;box-shadow:0 3px 0 var(--ink)}.stat small{display:block;font-size:8px;font-weight:900;color:#718077;letter-spacing:1px}.stat b{font-size:17px}.game{position:relative;min-height:580px;border:3px solid var(--ink);border-radius:24px;background:var(--cream);overflow:hidden;box-shadow:0 10px 0 #102d25}.camp{height:260px;position:relative;overflow:hidden;background:linear-gradient(#86cbee 0 55%,#69a45e 55%)}.sun{position:absolute;right:8%;top:8%;font-size:45px}.mountain{position:absolute;left:-5%;right:-5%;bottom:38%;height:42%;background:#456e57;clip-path:polygon(0 100%,20% 22%,35% 73%,55% 5%,72% 65%,87% 29%,100% 100%)}.ground{position:absolute;inset:55% 0 0;background:linear-gradient(#659551,#3e6f46)}.slot{position:absolute;z-index:3;display:flex;align-items:center;justify-content:center;border:2px dashed #fff9;border-radius:14px;color:#fff;font-size:11px;font-weight:1000;text-shadow:0 1px 2px #000;background:#183d3238}.slot.done{border:0;background:transparent;font-size:55px;text-shadow:none;filter:drop-shadow(0 7px 3px #0004)}#tentSlot{left:6%;bottom:13%;width:35%;height:39%}#fireSlot{left:43%;bottom:9%;width:23%;height:25%}#foodSlot{right:4%;bottom:10%;width:27%;height:33%}.phase{padding:14px 15px 0}.phase h2{margin:0;font-size:23px;letter-spacing:-1px}.mission{margin:5px 0 10px;font-size:11px;font-weight:800;color:#69746e}.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 15px}.action{min-height:88px;border:2px solid var(--ink);border-radius:14px;background:#fff;text-align:left;padding:10px;font-weight:1000;box-shadow:0 4px 0 var(--ink);cursor:pointer}.action:active{translate:0 4px;box-shadow:none}.action .ico{font-size:27px}.action small{display:block;margin-top:3px;color:#748078;font-size:9px}.action.locked{opacity:.38}.log{margin:0 14px 14px;padding:9px 11px;border-radius:10px;background:#dcedd5;font-size:10px;font-weight:850;min-height:33px}.panel{position:absolute;z-index:20;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:#fff7e5f3;backdrop-filter:blur(8px)}[hidden]{display:none!important}.eyebrow{margin:0 0 8px;color:var(--leaf);font-size:10px;font-weight:1000;letter-spacing:3px}.panel h1,.panel h2{margin:0;font-size:clamp(39px,12vw,72px);line-height:.9;letter-spacing:-5px}.panel h1 b{display:block;margin-top:13px;color:var(--red);font-size:.34em;letter-spacing:1px}.desc{margin:18px 0;color:#657169;font-weight:800;font-size:13px;line-height:1.8}.primary{min-width:225px;padding:15px 25px;border:2px solid var(--ink);border-radius:99px;background:var(--sun);font-weight:1000;box-shadow:0 6px 0 var(--ink)}.primary:active{translate:0 6px;box-shadow:none}.best{margin-top:15px;font-size:11px;font-weight:900;color:#738079}.resultIcon{font-size:75px}.score{font-size:65px;font-weight:1000;color:var(--leaf)}.bad{animation:shake .3s}.good{animation:flash .35s}@keyframes shake{25%{translate:-7px}75%{translate:7px}}@keyframes flash{50%{filter:brightness(1.35)}}@media(max-height:720px){.camp{height:205px}.game{min-height:510px}.action{min-height:72px}.phase{padding-top:9px}.cards{padding-bottom:9px}.log{margin-bottom:9px}.panel h1,.panel h2{font-size:42px}}</style></head><body><main class="app"><div class="top"><div class="brand">キャンプ場を<b>完成させろ！</b></div><div class="weather" id="weather">☀️ 晴れ</div></div><div class="stats"><div class="stat"><small>残り時間</small><b id="time">180分</b></div><div class="stat"><small>予算</small><b id="money">8,000円</b></div><div class="stat"><small>満足度</small><b id="happy">0</b></div></div><section class="game" id="game"><div class="camp"><div class="sun" id="sky">☀️</div><div class="mountain"></div><div class="ground"></div><div class="slot" id="tentSlot">テント未設営</div><div class="slot" id="fireSlot">火なし</div><div class="slot" id="foodSlot">BBQなし</div></div><div class="phase"><h2 id="phaseTitle">準備する物を選べ</h2><p class="mission" id="mission">日没までにテント・火・BBQを完成させよう</p></div><div class="cards" id="cards"></div><div class="log" id="log">準備開始！何から手をつける？</div><div class="panel" id="intro"><p class="eyebrow">CAMPING SURVIVAL</p><h1>キャンプ場で<br>BBQせよ！<b>日没までに宿泊準備を完成させろ</b></h1><p class="desc">天気・予算・残り時間は毎回変わる。<br>テント、火、食材、防寒対策を正しい順番で準備しよう。<br>忘れ物をすると夜に地獄を見る。</p><button class="primary" id="start">キャンプ開始</button><div class="best" id="bestTop">BEST 0点</div></div><div class="panel" id="ending" hidden><p class="eyebrow">CAMP RESULT</p><div class="resultIcon" id="resultIcon">🏕️</div><h2 id="resultTitle">キャンプ成功！</h2><div class="score" id="score">0点</div><p class="desc" id="resultText"></p><button class="primary" id="again">別の天気で挑戦</button><div class="best" id="bestEnd"></div></div></section></main><script>
(()=>{const $=id=>document.getElementById(id);const weatherList=[{name:'☀️ 晴れ',ico:'☀️',time:190,money:8000},{name:'🌦️ 夕立予報',ico:'🌦️',time:175,money:8500},{name:'🌬️ 強風',ico:'🌬️',time:185,money:7800},{name:'🥶 冷え込み',ico:'🥶',time:180,money:8200}];const actions=[
{id:'tent',ico:'⛺',name:'テントを設営',cost:0,time:45,happy:20,need:[],desc:'宿泊には絶対必要'},
{id:'peg',ico:'🔨',name:'ペグを補強',cost:500,time:20,happy:8,need:['tent'],desc:'風と雨への対策'},
{id:'fire',ico:'🔥',name:'炭に火をつける',cost:900,time:30,happy:18,need:[],desc:'早めの着火が安心'},
{id:'food',ico:'🥩',name:'肉と野菜を買う',cost:3200,time:25,happy:22,need:[],desc:'BBQの主役'},
{id:'drink',ico:'🧃',name:'飲み物を冷やす',cost:1200,time:15,happy:12,need:[],desc:'冷たい飲み物'},
{id:'light',ico:'🏮',name:'ランタンを準備',cost:1000,time:10,happy:12,need:[],desc:'夜の安全に必要'},
{id:'blanket',ico:'🧣',name:'毛布を用意',cost:1500,time:15,happy:12,need:[],desc:'冷え込みに強い'},
{id:'rain',ico:'🛡️',name:'タープを張る',cost:1800,time:30,happy:14,need:[],desc:'雨でもBBQできる'},
{id:'chair',ico:'🪑',name:'イスを並べる',cost:1000,time:15,happy:10,need:[],desc:'快適さアップ'},
{id:'cook',ico:'🍖',name:'BBQを焼く',cost:0,time:35,happy:28,need:['fire','food'],desc:'火と食材が必要'}];let s;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function begin(){const weather=weatherList[Math.floor(Math.random()*weatherList.length)];s={weather,time:weather.time,money:weather.money,happy:0,done:[],ended:false};$('intro').hidden=true;$('ending').hidden=true;$('weather').textContent=weather.name;$('sky').textContent=weather.ico;render();gtag?.('event','game_start',{game_name:'camp_master',weather:weather.name})}
function render(){updateStats();const available=shuffle(actions.filter(a=>!s.done.includes(a.id))).slice(0,6);$('cards').innerHTML=available.map(a=>`<button class="action" data-id="${a.id}"><span class="ico">${a.ico}</span><br>${a.name}<small>${a.cost.toLocaleString()}円・${a.time}分｜${a.desc}</small></button>`).join('');$('tentSlot').className='slot'+(s.done.includes('tent')?' done':'');$('tentSlot').textContent=s.done.includes('tent')?'⛺':'テント未設営';$('fireSlot').className='slot'+(s.done.includes('fire')?' done':'');$('fireSlot').textContent=s.done.includes('fire')?'🔥':'火なし';$('foodSlot').className='slot'+(s.done.includes('cook')?' done':'');$('foodSlot').textContent=s.done.includes('cook')?'🍖':'BBQなし';if(s.done.includes('tent')&&s.done.includes('cook')&&s.done.includes('light')){$('phaseTitle').textContent='最低限の準備は完成！';$('mission').textContent='残り時間で快適さと天候対策を上げよう'}else{$('phaseTitle').textContent='準備する物を選べ';$('mission').textContent='テント・BBQ・ランタンを揃えれば宿泊可能'}}function updateStats(){$('time').textContent=s.time+'分';$('money').textContent=s.money.toLocaleString()+'円';$('happy').textContent=s.happy}
$('cards').onclick=e=>{const b=e.target.closest('.action');if(!b||s.ended)return;const a=actions.find(x=>x.id===b.dataset.id);if(a.need.some(x=>!s.done.includes(x))){feedback('先に「'+a.need.map(x=>actions.find(y=>y.id===x).name).join('・')+'」が必要！',false);return}if(s.money<a.cost){feedback('予算不足！安い準備を優先しよう',false);return}if(s.time<a.time){feedback('時間が足りない！日没だ',false);finish();return}s.money-=a.cost;s.time-=a.time;s.happy+=a.happy;s.done.push(a.id);let bonus=0;if(a.id==='peg'&&s.weather.name.includes('強風'))bonus=20;if(a.id==='rain'&&s.weather.name.includes('夕立'))bonus=20;if(a.id==='blanket'&&s.weather.name.includes('冷え'))bonus=20;if(bonus){s.happy+=bonus;feedback('天気を読んだ！ボーナス +'+bonus,true)}else feedback(a.name+' 完了！',true);if(s.time<=15||s.done.length>=8)setTimeout(finish,650);else setTimeout(render,350)};
function feedback(text,good){$('log').textContent=text;$('game').classList.add(good?'good':'bad');navigator.vibrate?.(good?35:150);setTimeout(()=>$('game').classList.remove('good','bad'),350);updateStats()}
function finish(){if(s.ended)return;s.ended=true;let penalty=0,reasons=[];for(const id of ['tent','cook','light'])if(!s.done.includes(id)){penalty+=35;reasons.push(actions.find(a=>a.id===id).name+'なし')}if(s.weather.name.includes('強風')&&!s.done.includes('peg')){penalty+=18;reasons.push('強風でテントが不安定')}if(s.weather.name.includes('夕立')&&!s.done.includes('rain')){penalty+=18;reasons.push('雨でBBQがびしょ濡れ')}if(s.weather.name.includes('冷え')&&!s.done.includes('blanket')){penalty+=18;reasons.push('夜が寒すぎる')}let total=Math.max(0,s.happy*8+s.money/20+s.time*2-penalty*8),title='準備不足…',icon='😱';if(total>=1100){title='伝説のキャンパー！';icon='🏕️✨'}else if(total>=750){title='最高のキャンプ！';icon='😄🔥'}else if(total>=420){title='なんとか宿泊成功';icon='😅⛺'}const best=Math.max(+(localStorage.campMasterBest||0),Math.round(total));localStorage.campMasterBest=best;$('resultTitle').textContent=title;$('resultIcon').textContent=icon;$('score').textContent=Math.round(total)+'点';$('resultText').textContent=reasons.length?'反省点：'+reasons.join('／'):'BBQも宿泊準備も完璧。残金と時間も得点になった！';$('bestEnd').textContent='BEST '+best+'点';$('ending').hidden=false;gtag?.('event','game_complete',{game_name:'camp_master',score:Math.round(total),weather:s.weather.name})}function updateBest(){$('bestTop').textContent='BEST '+(localStorage.campMasterBest||0)+'点'}$('start').onclick=begin;$('again').onclick=()=>{updateBest();begin()};updateBest()})();
</script></body></html>
