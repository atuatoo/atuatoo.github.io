<style>:root{--ink:#0c1014;--steel:#222b31;--line:#687881;--orange:#ff6b35;--paper:#d7d1c3;--green:#9bd65c}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#fff}button{font:inherit}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));gap:8px}header{display:flex;justify-content:space-between;align-items:center;padding:0 4px}.brand{font-size:17px;font-weight:1000;letter-spacing:-1px}.brand b{color:var(--orange)}.chapter{font-size:10px;color:#94a2a9;font-weight:900;letter-spacing:1px}.scene{position:relative;min-height:0;overflow:hidden;border:2px solid #52616a;border-radius:22px;background:#252d31;box-shadow:0 16px 50px #0009}.room{position:absolute;inset:0;background:linear-gradient(#364147 0 72%,#1c2428 72%);transition:.35s}.room:before{content:"";position:absolute;inset:0;opacity:.18;background-image:linear-gradient(90deg,transparent 49%,#9aa 50%,transparent 51%),linear-gradient(transparent 49%,#9aa 50%,transparent 51%);background-size:80px 55px}.object{position:absolute;z-index:3;border:0;background:transparent;color:#fff;cursor:pointer;filter:drop-shadow(0 7px 5px #0007);animation:bob 2s infinite alternate}.object:active{scale:.9}.bed{left:5%;bottom:12%;font-size:80px}.sink{right:7%;top:25%;font-size:64px}.poster{left:10%;top:13%;font-size:60px}.vent{right:10%;bottom:16%;font-size:60px}.door{left:50%;top:18%;translate:-50%;font-size:125px}.locker{left:8%;top:20%;font-size:90px}.camera{right:8%;top:12%;font-size:58px}.terminal{left:50%;top:28%;translate:-50%;font-size:110px}.gate{left:50%;top:18%;translate:-50%;font-size:150px}.crate{left:8%;bottom:13%;font-size:75px}.gauchi{position:absolute;z-index:2;left:50%;bottom:10%;translate:-50%;font-size:90px;filter:drop-shadow(0 8px 5px #0008)}.bubble{position:absolute;z-index:7;left:50%;top:13px;translate:-50%;width:88%;padding:10px 13px;border-radius:12px;background:#0c1014dd;text-align:center;font-size:12px;font-weight:800;color:#e9e4da;pointer-events:none}.spark{animation:spark 1s infinite}.inventory{display:flex;align-items:center;gap:7px;min-height:58px;padding:6px 8px;border:1px solid #334148;border-radius:16px;background:#151c20;overflow-x:auto}.inventory strong{font-size:9px;color:#74868f;letter-spacing:1px;margin-right:3px}.item{flex:0 0 auto;border:1px solid #425159;border-radius:11px;background:#232d32;color:#fff;padding:8px 10px;font-size:21px}.item.selected{border-color:var(--orange);box-shadow:0 0 0 2px #ff6b3544}.panel{position:absolute;z-index:20;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:#0c1014f2;backdrop-filter:blur(8px);overflow:auto}[hidden]{display:none!important}.eyebrow{margin:0 0 9px;color:var(--orange);font-size:10px;font-weight:1000;letter-spacing:3px}.panel h1,.panel h2{margin:0;font-size:clamp(42px,13vw,80px);line-height:.88;letter-spacing:-5px}.panel h1 b{display:block;color:var(--orange);font-size:.42em;letter-spacing:0;margin-top:14px}.desc{margin:18px 0;color:#a5b0b5;font-size:13px;font-weight:700;line-height:1.8}.primary{border:0;border-radius:999px;background:var(--orange);color:#fff;min-width:225px;padding:16px 24px;font-size:15px;font-weight:1000;box-shadow:0 9px 27px #ff6b3544}.secondary{margin-top:10px;border:0;background:transparent;color:#91a0a8;text-decoration:underline;font-size:11px;font-weight:800}.code{display:flex;gap:7px;margin:16px 0}.code input{width:50px;height:59px;border:2px solid #536169;border-radius:10px;background:#171e22;color:#fff;text-align:center;font-size:27px;font-weight:1000}.choices{display:grid;gap:9px;width:min(350px,100%);margin:18px 0}.choice{border:1px solid #52616a;border-radius:14px;background:#1c252a;color:#fff;padding:14px;font-weight:900}.progress{display:flex;gap:6px;margin-top:16px}.progress i{width:28px;height:5px;border-radius:9px;background:#344148}.progress i.on{background:var(--orange)}.ending{font-size:75px;margin:10px}@keyframes bob{to{translate:0 -4px}}@keyframes spark{50%{filter:drop-shadow(0 0 15px var(--orange));scale:1.08}}@media(max-height:620px){.panel h1,.panel h2{font-size:42px}.desc{margin:9px 0}.object{scale:.8}.gauchi{font-size:70px}}</style></head><body><main class="app"><header><div class="brand">がうちを<b>脱出させろ。</b></div><div class="chapter" id="chapter">CHAPTER 1 / 4</div></header><section class="scene" id="scene"><div class="room" id="room"></div><div class="bubble" id="bubble">怪しい場所をタップしろ</div><div class="gauchi" id="gauchi">🧑‍🦲</div><div class="panel" id="intro"><p class="eyebrow">PRISON ESCAPE GAME</p><h1>がうちを<br>脱出させろ。<b>刑務所編</b></h1><p class="desc">無実のがうちが刑務所に閉じ込められた。<br>部屋を調べ、謎を解き、夜明けまでに脱出させろ。</p><button class="primary" id="start">独房を調べる →</button><button class="secondary" id="continue" hidden>続きから</button></div><div class="panel" id="keypad" hidden><p class="eyebrow">SECURITY CODE</p><h2>4桁の暗号</h2><p class="desc">独房で見つけたメモを思い出せ。</p><div class="code"><input inputmode="numeric" maxlength="1"><input inputmode="numeric" maxlength="1"><input inputmode="numeric" maxlength="1"><input inputmode="numeric" maxlength="1"></div><button class="primary" id="unlock">解除する</button><button class="secondary" id="closePad">戻る</button></div><div class="panel" id="choicePanel" hidden><p class="eyebrow">FINAL CHOICE</p><h2>最後の選択</h2><p class="desc">出口は2つ。どちらを選ぶ？</p><div class="choices"><button class="choice" data-end="truck">🚚 謎の配達車に隠れる</button><button class="choice" data-end="gate">🚪 正面ゲートを堂々と通る</button></div></div><div class="panel" id="ending" hidden><p class="eyebrow">ESCAPE COMPLETE</p><div class="ending" id="endingIcon">🌅</div><h2>脱出成功。</h2><p class="desc" id="endingText">がうちは自由を取り戻した。</p><button class="primary" id="again">別の結末を見る</button></div></section><div class="inventory" id="inventory"><strong>ITEM</strong></div></main><script>
(()=>{const $=id=>document.getElementById(id),room=$('room'),bubble=$('bubble'),inv=$('inventory');let state={chapter:1,items:[],flags:{},selected:''};const save=()=>localStorage.gauchiSave=JSON.stringify(state),say=t=>{bubble.textContent=t;bubble.animate([{opacity:.2},{opacity:1}],{duration:180})};function item(id,icon,name){if(state.items.includes(id))return;state.items.push(id);say(name+'を手に入れた');renderInv();save()}function has(id){return state.items.includes(id)}function use(id){state.items=state.items.filter(x=>x!==id);if(state.selected===id)state.selected='';renderInv();save()}const info={spoon:['🥄','曲がったスプーン'],memo:['📄','暗号メモ'],card:['💳','警備カード'],uniform:['🥼','作業服'],key:['🗝️','ゲートキー']};function renderInv(){inv.innerHTML='<strong>ITEM</strong>'+state.items.map(id=>`<button class="item ${state.selected===id?'selected':''}" data-id="${id}" title="${info[id][1]}">${info[id][0]}</button>`).join('')}inv.onclick=e=>{const b=e.target.closest('.item');if(!b)return;state.selected=state.selected===b.dataset.id?'':b.dataset.id;renderInv();say(state.selected?info[state.selected][1]+'を選択中':'アイテム選択を解除')};function obj(cls,emoji,label,x){const b=document.createElement('button');b.className='object '+cls+(x?' spark':'');b.textContent=emoji;b.ariaLabel=label;b.dataset.action=cls;room.appendChild(b)}function setChapter(n){state.chapter=n;state.selected='';$('chapter').textContent='CHAPTER '+n+' / 4';room.innerHTML='';$('gauchi').hidden=false;if(n===1){room.style.background='linear-gradient(#3b454a 0 72%,#1b2327 72%)';obj('bed','🛏️','ベッド');obj('sink','🚰','洗面台');obj('poster','🖼️','ポスター');obj('vent','▤','通気口');obj('door','🚪','独房のドア')}if(n===2){room.style.background='linear-gradient(90deg,#20282d,#455157 48%,#20282d)';obj('locker','🗄️','ロッカー');obj('camera','📹','監視カメラ');obj('door','🚪','監視室のドア');say('監視カメラに見つかる前に進め')}if(n===3){room.style.background='radial-gradient(circle,#39484e,#131b1f)';obj('terminal','🖥️','セキュリティ端末');obj('crate','📦','箱');obj('door','🚪','外へのドア');say('端末を解除して外壁の鍵を探せ')}if(n===4){room.style.background='linear-gradient(#14202c 0 65%,#30352f 65%)';obj('gate','⛓️','正面ゲート');$('gauchi').hidden=true;say('最後の出口だ');setTimeout(()=>$('choicePanel').hidden=false,700)}save()}
room.onclick=e=>{const a=e.target.closest('.object')?.dataset.action;if(!a)return;if(state.chapter===1){if(a==='bed'){if(!state.flags.bed){state.flags.bed=true;item('spoon','🥄','曲がったスプーン')}else say('もう何もない')}if(a==='poster'){if(!state.flags.memo){state.flags.memo=true;item('memo','📄','暗号メモ「7・3・1・4」')}else say('裏には「7314」と書かれている')}if(a==='sink')say('水滴が「短・長・短・長」と落ちている');if(a==='vent'){if(state.selected==='spoon'){use('spoon');state.flags.vent=true;item('card','💳','警備カード')}else say('ネジを回せる物が必要だ')}if(a==='door'){if(state.selected==='card'){use('card');say('独房のロックが開いた');setTimeout(()=>setChapter(2),700)}else say('カード式のロックだ')}}else if(state.chapter===2){if(a==='locker'){if(!state.flags.uniform){state.flags.uniform=true;item('uniform','🥼','清掃員の作業服')}else say('空のロッカーだ')}if(a==='camera'){if(state.selected==='uniform')say('作業員に変装している。怪しまれていない');else say('顔を映すのは危険だ')}if(a==='door'){if(state.selected==='uniform'){say('清掃員のふりをして監視室へ');setTimeout(()=>setChapter(3),700)}else say('この格好では怪しまれる')}}else if(state.chapter===3){if(a==='terminal')$('keypad').hidden=false;if(a==='crate'){if(state.flags.code&&!state.flags.key){state.flags.key=true;item('key','🗝️','ゲートキー')}else if(!state.flags.code)say('電子ロックされている');else say('箱は空だ')}if(a==='door'){if(state.selected==='key'){use('key');setChapter(4)}else say('外壁用の鍵が必要だ')}}};
document.querySelectorAll('.code input').forEach((x,i,all)=>x.oninput=()=>{x.value=x.value.replace(/\D/g,'').slice(-1);if(x.value&&all[i+1])all[i+1].focus()});$('unlock').onclick=()=>{const code=[...document.querySelectorAll('.code input')].map(x=>x.value).join('');if(code==='7314'){state.flags.code=true;$('keypad').hidden=true;say('解除成功。箱のロックが外れた');save()}else{say('暗号が違う');navigator.vibrate?.(160)}};$('closePad').onclick=()=>$('keypad').hidden=true;document.querySelectorAll('[data-end]').forEach(b=>b.onclick=()=>{const end=b.dataset.end;$('choicePanel').hidden=true;$('ending').hidden=false;$('endingIcon').textContent=end==='truck'?'🚚💨':'😎🚪';$('endingText').textContent=end==='truck'?'荷物に紛れ、がうちは朝焼けの街へ消えた。':'作業服のまま堂々とゲートを通過。誰も気づかなかった。';localStorage.removeItem('gauchiSave');gtag?.('event','game_complete',{game_name:'gauchi_prison',ending:end})});function start(fresh=true){if(fresh){state={chapter:1,items:[],flags:{},selected:''}}$('intro').hidden=true;$('ending').hidden=true;renderInv();setChapter(state.chapter);gtag?.('event','game_start',{game_name:'gauchi_prison'})}$('start').onclick=()=>start(true);$('continue').onclick=()=>start(false);$('again').onclick=()=>{state={chapter:1,items:[],flags:{},selected:''};$('ending').hidden=true;start(true)};try{const s=JSON.parse(localStorage.gauchiSave||'null');if(s?.chapter){state=s;$('continue').hidden=false}}catch{}renderInv()})();
</script></body></html>
