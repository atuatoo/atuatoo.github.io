<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#1677ff"><title>ちはるをさがせ！夏休み旅行編</title><meta name="description" content="旅行先ではぐれたちはるを、地図と手がかりから見つける探索ゲーム。">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JBQZ5L4VN6"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-JBQZ5L4VN6');</script>
<style>
:root{--blue:#1677ff;--navy:#12304f;--yellow:#ffd84a;--paper:#fffdf4;--red:#ff4f5e}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#c9efff;color:var(--navy)}button{font:inherit}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;gap:8px;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between}.logo{font-weight:1000;font-size:18px;letter-spacing:-1px}.logo b{color:var(--red)}.stats{display:flex;gap:6px}.pill{padding:6px 9px;border-radius:99px;background:#fff;font-size:11px;font-weight:900;box-shadow:0 3px 10px #1463a522}.map{position:relative;min-height:0;overflow:hidden;border:3px solid var(--navy);border-radius:23px;background:#a9e6a4;box-shadow:0 12px 35px #12304f33}.map:before{content:"";position:absolute;inset:0;background:linear-gradient(25deg,transparent 44%,#fff4 45% 51%,transparent 52%),linear-gradient(115deg,transparent 42%,#fff5 43% 49%,transparent 50%);background-size:190px 170px}.river{position:absolute;left:48%;top:-10%;width:16%;height:120%;background:#65c9f4;rotate:8deg;border-inline:4px solid #d9f5ff}.place{position:absolute;z-index:2;width:76px;height:72px;border:2px solid var(--navy);border-radius:18px;background:var(--paper);color:var(--navy);font-weight:1000;font-size:10px;box-shadow:0 5px 0 var(--navy);cursor:pointer}.place:active{translate:0 4px;box-shadow:0 1px 0 var(--navy)}.place span{display:block;font-size:29px}.p0{left:5%;top:7%}.p1{right:5%;top:8%}.p2{left:8%;bottom:9%}.p3{right:7%;bottom:8%}.p4{left:50%;top:48%;translate:-50% -50%}.p4:active{translate:-50% calc(-50% + 4px)}.panel{position:absolute;z-index:20;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;background:#fffdf4f5;backdrop-filter:blur(6px);overflow:auto}[hidden]{display:none!important}.sun{font-size:65px}.eyebrow{margin:0 0 7px;color:var(--blue);font-size:10px;font-weight:1000;letter-spacing:2px}.panel h1,.panel h2{margin:0;font-size:clamp(37px,12vw,68px);line-height:.95;letter-spacing:-4px}.panel h1 b{color:var(--red)}.desc{max-width:420px;margin:14px 0;font-size:13px;line-height:1.7;font-weight:700}.primary{border:2px solid var(--navy);border-radius:99px;background:var(--yellow);color:var(--navy);padding:14px 24px;min-width:220px;font-weight:1000;box-shadow:0 6px 0 var(--navy)}.primary:active{translate:0 5px;box-shadow:0 1px 0 var(--navy)}.secondary{margin-top:12px;border:0;background:none;color:#52708b;text-decoration:underline;font-size:11px;font-weight:800}.cluebox{width:min(460px,96%);padding:12px 14px;border:2px solid var(--navy);border-radius:15px;background:white;text-align:left;font-size:12px;font-weight:800;line-height:1.65}.cluebox p{margin:5px 0}.cluebox p:before{content:"🔎 "}.resultIcon{font-size:70px}.bottom{display:flex;gap:7px}.clues{flex:1;border:2px solid var(--navy);border-radius:14px;background:white;color:var(--navy);padding:11px;font-size:12px;font-weight:1000}.help{border:2px solid var(--navy);border-radius:14px;background:var(--blue);color:white;padding:11px 15px;font-weight:1000}.toast{position:absolute;z-index:12;left:50%;bottom:12px;translate:-50%;width:88%;padding:11px;border-radius:12px;background:#12304fee;color:#fff;text-align:center;font-size:12px;font-weight:900;pointer-events:none}.stamp{display:inline-block;margin:8px;padding:7px 13px;border:3px solid var(--red);border-radius:8px;color:var(--red);font-weight:1000;rotate:-5deg}.shake{animation:shake .3s}@keyframes shake{25%{translate:-7px}75%{translate:7px}}@media(max-height:610px){.panel h1,.panel h2{font-size:38px}.desc{margin:8px}.sun,.resultIcon{font-size:42px}.place{height:62px}.place span{font-size:24px}}
</style></head><body><main class="app"><header class="top"><div class="logo">ちはるを<b>さがせ！</b></div><div class="stats"><div class="pill" id="day">DAY 1</div><div class="pill">⏰ <span id="time">90</span></div><div class="pill">⭐ <span id="score">0</span></div></div></header><section class="map" id="map"><div class="river"></div><button class="place p0" data-place="station"><span>🚉</span>なついろ駅</button><button class="place p1" data-place="hotel"><span>🏨</span>ホテル</button><button class="place p2" data-place="beach"><span>🏖️</span>海水浴場</button><button class="place p3" data-place="museum"><span>🏛️</span>恐竜博物館</button><button class="place p4" data-place="market"><span>🎆</span>夏祭り</button><div class="toast" id="toast">地図の場所をタップして聞き込みしよう</div>
<div class="panel" id="intro"><div class="sun">🌻</div><p class="eyebrow">SUMMER VACATION MYSTERY</p><h1>ちはるを<br><b>さがせ！</b></h1><p class="desc">家族旅行の途中、友だちの「ちはる」とはぐれてしまった！<br>駅員さんや家族と連絡を取りながら、目撃情報を集めて見つけよう。</p><button class="primary" id="start">旅行をはじめる →</button><button class="secondary" id="how">遊び方</button></div>
<div class="panel" id="cluePanel" hidden><p class="eyebrow">TRAVEL NOTE</p><h2>集めた手がかり</h2><div class="cluebox" id="clueList"></div><button class="primary" id="closeClue">地図にもどる</button></div>
<div class="panel" id="ending" hidden><div class="resultIcon" id="resultIcon">🎉</div><p class="eyebrow" id="resultEye">FOUND!</p><h2 id="resultTitle">ちはる発見！</h2><p class="desc" id="resultText"></p><div class="stamp" id="rank">名探偵</div><button class="primary" id="next">次の旅行へ →</button></div>
</section><footer class="bottom"><button class="clues" id="showClues">📒 手がかり <span id="clueCount">0</span>/3</button><button class="help" id="hint">💡 ヒント</button></footer></main>
<script>
(()=>{const $=id=>document.getElementById(id);const places={station:'なついろ駅',hotel:'ホテル',beach:'海水浴場',museum:'恐竜博物館',market:'夏祭り'};const facts={station:['電車の音が聞こえる場所ではない','切符は持っていなかった'],hotel:['建物の中には入っていない','部屋の鍵は家族が持っている'],beach:['靴に砂はついていなかった','海が見える場所にはいない'],museum:['大きな恐竜を見たと言っていた','涼しい建物に入ったらしい'],market:['赤いちょうちんの近くで見た人がいる','甘いりんご飴を買ったらしい']};let game=null,timer=null,day=1,total=0;const toast=t=>{$('toast').textContent=t;$('toast').animate([{opacity:.2},{opacity:1}],{duration:180})};function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function newGame(){clearInterval(timer);const ids=Object.keys(places),target=ids[Math.floor(Math.random()*ids.length)];game={target,visited:[],clues:[],time:90,ended:false};$('ending').hidden=true;$('intro').hidden=true;$('day').textContent='DAY '+day;$('time').textContent=game.time;$('score').textContent=total;$('clueCount').textContent=0;document.querySelectorAll('.place').forEach(b=>{b.disabled=false;b.style.opacity=1});toast('目撃情報を3つ集めよう');timer=setInterval(()=>{if(game.ended)return;game.time--;$('time').textContent=game.time;if(game.time<=0)finish(false)},1000);gtag?.('event','game_start',{game_name:'find_chiharu',day})}function investigate(id){if(!game||game.ended)return;if(game.visited.includes(id)){if(game.clues.length>=2&&id===game.target)return finish(true);return toast('ここはもう調べたよ')};game.visited.push(id);const correct=id===game.target;if(correct&&game.clues.length<2){toast('ちはるらしい人影！でも、もう少し確認しよう');game.clues.push('「'+places[id]+'」の近くで、ちはるに似た子を見た') }else if(correct){return finish(true)}else{const clue=facts[id][Math.floor(Math.random()*facts[id].length)];game.clues.push('聞き込み：'+clue);toast('手がかりを発見！')};$('clueCount').textContent=Math.min(game.clues.length,3);event.currentTarget.style.opacity=.55;if(game.clues.length>=3)toast('手がかりがそろった！ちはるの場所を選ぼう')}document.querySelectorAll('.place').forEach(b=>b.onclick=()=>investigate(b.dataset.place));function showClues(){if(!game)return;$('clueList').innerHTML=game.clues.length?game.clues.map(x=>'<p>'+x+'</p>').join(''):'<p>まだ手がかりはありません</p>';$('cluePanel').hidden=false}$('showClues').onclick=showClues;$('closeClue').onclick=()=>$('cluePanel').hidden=true;$('hint').onclick=()=>{if(!game)return;const wrong=shuffle(Object.keys(places).filter(x=>x!==game.target&&!game.visited.includes(x)))[0];if(wrong)toast('ヒント：「'+places[wrong]+'」ではないみたい');else toast('集めた手がかりを読み返そう')};function finish(ok){if(game.ended)return;game.ended=true;clearInterval(timer);$('ending').hidden=false;if(ok){const gain=Math.max(100,game.time*10-game.visited.length*30);total+=gain;$('score').textContent=total;$('resultIcon').textContent='👧🎒';$('resultEye').textContent='FOUND!';$('resultTitle').textContent='ちはる発見！';$('resultText').textContent=places[game.target]+'にいた！ 残り'+game.time+'秒。+'+gain+'点';$('rank').textContent=game.time>=65?'旅行名探偵':game.time>=35?'すごい観察力':'ねばり勝ち';gtag?.('event','game_complete',{game_name:'find_chiharu',score:gain})}else{$('resultIcon').textContent='📢';$('resultEye').textContent='TIME UP';$('resultTitle').textContent='駅員さんが発見';$('resultText').textContent='ちはるは「'+places[game.target]+'」にいた。次はもっと早く見つけよう！';$('rank').textContent='再挑戦'}}$('next').onclick=()=>{day++;newGame()};$('start').onclick=newGame;$('how').onclick=()=>alert('場所をタップして聞き込み→手がかりを3つ集める→ちはるがいると思う場所をもう一度タップ。制限時間は90秒！')})();
</script></body></html>
