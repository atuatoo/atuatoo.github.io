];let s,voices=[];function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function speak(text){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.82;const v=voices.find(x=>x.lang?.toLowerCase().startsWith('zh'));if(v)u.voice=v;speechSynthesis.speak(u)}speechSynthesis.onvoiceschanged=()=>voices=speechSynthesis.getVoices();voices=speechSynthesis.getVoices();function begin(){s={list:shuffle(questions).slice(0,10),i:0,stars:0,tries:0};$('intro').hidden=true;$('ending').hidden=true;drawProgress();show();gtag?.('event','game_start',{game_name:'ryan_adventure_cn'})}function drawProgress(){$('progress').innerHTML=Array.from({length:10},(_,i)=>`<i class="${i<s.i?'on':''}"></i>`).join('')}function show(){const q=s.list[s.i];s.tries=0;$('question').textContent=q.q;$('message').textContent='选择正确答案！';$('choices').innerHTML=shuffle(q.c).map(x=>`<button class="choice" data-word="${x[1]}">${x[0]}<span class="word">${x[1]}</span></button>`).join('');$('stars').textContent=s.stars;drawProgress();setTimeout(()=>speak(q.say),350)}$('choices').onclick=e=>{const b=e.target.closest('.choice');if(!b)return;const q=s.list[s.i];if(b.dataset.word===q.a){if(s.tries===0)s.stars++;$('stars').textContent=s.stars;$('message').textContent='答对了！太棒了！⭐';$('ryan').textContent='😄';$('game').classList.add('good');speak('答对了，太棒了');[...$('choices').children].forEach(x=>x.disabled=true);setTimeout(()=>{$('game').classList.remove('good');$('ryan').textContent='👦🏻';if(++s.i>=10)finish();else show()},900)}else{s.tries++;$('message').textContent='再试一次，你可以的！';$('ryan').textContent='🙂';$('game').classList.add('wrong');navigator.vibrate?.(80);speak('再试一次');setTimeout(()=>$('game').classList.remove('wrong'),300)}};function finish(){const best=Math.max(+(localStorage.ryanCNBest||0),s.stars);localStorage.ryanCNBest=best;$('finalStars').textContent=s.stars;$('resultTitle').textContent=s.stars>=9?'太棒了，Ryan！':s.stars>=6?'做得很好！':'继续加油！';$('resultIcon').textContent=s.stars>=9?'
