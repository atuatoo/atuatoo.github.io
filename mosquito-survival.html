<html lang="ja"><head>

<title>蚊ハンター SURVIVAL</title><meta name="description" content="60秒生き残れ。コンボ、ボス、コイン強化付き蚊ハンター。">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JBQZ5L4VN6"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-JBQZ5L4VN6');</script>
<style>
:root{--lime:#b8ff38;--red:#ff355e;--ink:#07120d;--panel:#102119;--paper:#f5f1e7;--gold:#ffd34d}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#fff}button{font:inherit}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));gap:8px}header{display:grid;grid-template-columns:1fr repeat(3,auto);align-items:center;gap:13px;padding:0 4px}.brand{font-weight:1000;font-size:17px;letter-spacing:-1px}.brand b{color:var(--lime)}.stat{text-align:right}.stat small{display:block;font-size:7px;color:#749280;font-weight:900;letter-spacing:1px}.stat strong{font-size:19px;font-variant-numeric:tabular-nums}.arena{position:relative;min-height:0;overflow:hidden;border:2px solid #31513f;border-radius:22px;background:radial-gradient(circle at 50% 35%,#193828,#09160f 72%);touch-action:none;box-shadow:0 15px 55px #0008}.gridbg{position:absolute;inset:0;opacity:.08;background-image:linear-gradient(#b8ff38 1px,transparent 1px),linear-gradient(90deg,#b8ff38 1px,transparent 1px);background-size:30px 30px}.hud{position:absolute;z-index:6;left:12px;right:12px;top:12px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.hearts{font-size:20px;letter-spacing:2px}.combo{padding:7px 12px;border-radius:999px;background:#07120dcc;color:var(--lime);font-size:12px;font-weight:1000;opacity:0;transition:.15s}.combo.on{opacity:1;scale:1.08}.enemy{position:absolute;z-index:4;display:grid;place-items:center;border:0;background:transparent;line-height:1;user-select:none;filter:drop-shadow(0 5px 5px #0007);transition:opacity .15s}.enemy:active{scale:.75}.normal{font-size:50px}.fast{font-size:38px;filter:drop-shadow(0 0 8px #ffcc00)}.armor{font-size:59px;filter:drop-shadow(0 0 8px #66b7ff)}.ghost{font-size:46px;opacity:.35}.bomb{font-size:48px;animation:pulse .5s infinite alternate}.boss{font-size:100px;filter:drop-shadow(0 0 18px var(--red));animation:bossPulse .5s infinite alternate}.hp{position:absolute;left:7%;right:7%;bottom:-8px;height:6px;border-radius:9px;background:#411}.hp i{display:block;height:100%;border-radius:9px;background:var(--red)}.spray{position:absolute;z-index:7;right:13px;bottom:13px;width:78px;height:78px;border:3px solid var(--lime);border-radius:50%;background:#142b1e;color:#fff;font-size:10px;font-weight:1000;box-shadow:0 0 25px #b8ff3844}.spray strong{display:block;font-size:22px;color:var(--lime)}.spray:disabled{opacity:.35}.alert{position:absolute;z-index:8;left:50%;top:18%;translate:-50%;width:90%;text-align:center;color:var(--red);font-size:clamp(32px,12vw,72px);font-weight:1000;letter-spacing:-4px;animation:alert .6s both;pointer-events:none}.panel{position:absolute;z-index:20;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;background:#07120df2;backdrop-filter:blur(8px);overflow:auto}[hidden]{display:none!important}.eyebrow{margin:0 0 8px;color:var(--lime);font-size:10px;font-weight:1000;letter-spacing:3px}.panel h1,.panel h2{margin:0;font-size:clamp(43px,13vw,82px);line-height:.86;letter-spacing:-5px}.panel h1 b{display:block;color:var(--lime);font-size:.42em;letter-spacing:0;margin-top:14px}.desc{margin:16px 0;color:#a9b9af;font-size:13px;line-height:1.7;font-weight:700}.primary{border:0;border-radius:999px;background:var(--lime);color:var(--ink);min-width:220px;padding:15px 24px;font-size:15px;font-weight:1000;box-shadow:0 8px 25px #b8ff3844}.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:min(440px,100%);margin:13px 0}.upgrade{border:1px solid #31513f;border-radius:13px;background:var(--panel);color:#fff;padding:10px 5px;font-size:10px;font-weight:800}.upgrade strong{display:block;color:var(--gold);font-size:17px;margin:4px}.upgrade:disabled{opacity:.45}.coins{color:var(--gold);font-weight:1000}.mission{margin:7px 0 14px;padding:8px 13px;border:1px solid #31513f;border-radius:999px;color:#b8cabe;font-size:11px;font-weight:800}.resultScore{font-size:clamp(80px,24vw,140px);font-weight:1000;line-height:.8;color:var(--lime);letter-spacing:-8px;margin:12px 0}.resultRow{display:flex;gap:25px;margin:8px 0 16px}.resultRow small{display:block;color:#6e8c79;font-size:8px;font-weight:900}.resultRow strong{font-size:22px}.back{margin-top:10px;border:0;background:transparent;color:#8aa093;font-size:11px;text-decoration:underline}.particle{position:absolute;z-index:10;width:7px;height:7px;border-radius:50%;background:var(--lime);pointer-events:none;animation:fly .5s forwards}@keyframes pulse{to{scale:1.13}}@keyframes bossPulse{to{scale:1.06}}@keyframes alert{0%{opacity:0;scale:.5}30%{opacity:1;scale:1.1}100%{opacity:0;scale:1}}@keyframes fly{to{translate:var(--x) var(--y);opacity:0}}@media(max-height:650px){.desc{margin:9px 0}.panel h1,.panel h2{font-size:42px}.shop{margin:8px 0}.upgrade{padding:6px 3px}.mission{margin:4px 0 8px}.resultScore{font-size:70px}}
</style></head><body><main class="app"><header><div class="brand">蚊<b>HUNTER</b></div><div class="stat"><small>TIME</small><strong id="time">60</strong></div><div class="stat"><small>SCORE</small><strong id="score">0</strong></div><div class="stat"><small>COIN</small><strong id="coin">0</strong></div></header><section class="arena" id="arena"><div class="gridbg"></div><div class="hud"><div class="hearts" id="hearts">❤️❤️❤️</div><div class="combo" id="combo">COMBO ×0</div></div><button class="spray" id="spray" disabled><strong id="gauge">0%</strong>全滅スプレー</button><div class="panel" id="intro"><p class="eyebrow">60 SECOND SURVIVAL</p><h1>蚊を狩れ。<b>進化するサバイバル</b></h1><p class="desc">蚊を倒してコンボをつなげ。爆弾は避けろ。<br>30秒後、巨大ボスが来る。</p><div class="coins">🪙 所持コイン <span id="wallet">0</span></div><div class="shop"><button class="upgrade" data-up="heart">❤️ LIFE<strong>Lv.<span>0</span></strong><em>🪙20</em></button><button class="upgrade" data-up="time">⏱ TIME<strong>Lv.<span>0</span></strong><em>🪙20</em></button><button class="upgrade" data-up="power">💥 POWER<strong>Lv.<span>0</span></strong><em>🪙20</em></button></div><div class="mission" id="mission">今日の任務：ボス蚊を倒せ</div><button class="primary" id="start">狩りを始める →</button></div><div class="panel" id="result" hidden><p class="eyebrow">SURVIVAL RESULT</p><h2 id="resultTitle">生還。</h2><div class="resultScore" id="final">0</div><div class="resultRow"><div><small>BEST</small><strong id="best">0</strong></div><div><small>KILLS</small><strong id="kills">0</strong></div><div><small>COINS</small><strong id="earned">+0</strong></div></div><button class="primary" id="retry">もう一度 →</button><button class="back" id="menu">強化画面に戻る</button></div></section></main><script>
(()=>{const $=id=>document.getElementById(id),arena=$('arena');let enemies=[],running=false,startAt=0,duration=60,score=0,kills=0,hearts=3,combo=0,lastKill=0,gauge=0,nextSpawn=0,bossSpawned=false,raf=0,idSeq=0;let wallet=Number(localStorage.mosqCoins||0),up=JSON.parse(localStorage.mosqUp||'{"heart":0,"time":0,"power":0}');const types={normal:{emoji:'🦟',cls:'normal',hp:1,pts:10,life:2500},fast:{emoji:'🦟',cls:'fast',hp:1,pts:18,life:1500},armor:{emoji:'🪲',cls:'armor',hp:2,pts:28,life:3300},ghost:{emoji:'🦟',cls:'ghost',hp:1,pts:35,life:1800},bomb:{emoji:'💣',cls:'bomb',hp:1,pts:0,life:2400},boss:{emoji:'🦟',cls:'boss',hp:14,pts:300,life:18000}};
function save(){localStorage.mosqCoins=wallet;localStorage.mosqUp=JSON.stringify(up)}function menu(){wallet=Number(localStorage.mosqCoins||0);$('wallet').textContent=wallet;document.querySelectorAll('.upgrade').forEach(b=>{const k=b.dataset.up,l=up[k],cost=20+l*25;b.querySelector('span').textContent=l;b.querySelector('em').textContent='🪙'+cost;b.disabled=l>=3||wallet<cost});$('intro').hidden=false;$('result').hidden=true}function pos(el,size){const r=arena.getBoundingClientRect();el.style.left=12+Math.random()*Math.max(1,r.width-size-24)+'px';el.style.top=55+Math.random()*Math.max(1,r.height-size-80)+'px'}
function spawn(kind){if(!running)return;const t=types[kind],e={id:++idSeq,kind,hp:t.hp,max:t.hp,born:performance.now()},el=document.createElement('button');e.el=el;el.className='enemy '+t.cls;el.textContent=t.emoji;el.dataset.id=e.id;el.ariaLabel=kind==='bomb'?'爆弾':'蚊';if(t.hp>1){const bar=document.createElement('span');bar.className='hp';bar.innerHTML='<i></i>';el.appendChild(bar)}arena.appendChild(el);pos(el,kind==='boss'?110:60);enemies.push(e)}function remove(e){e.el.remove();enemies=enemies.filter(x=>x!==e)}function particles(x,y){for(let i=0;i<7;i++){const p=document.createElement('i');p.className='particle';p.style.left=x+'px';p.style.top=y+'px';p.style.setProperty('--x',(Math.random()*90-45)+'px');p.style.setProperty('--y',(Math.random()*90-45)+'px');arena.appendChild(p);setTimeout(()=>p.remove(),550)}}
function hit(e,x,y){if(e.kind==='bomb'){remove(e);damage('爆弾を押した');return}e.hp-=1+Math.floor(up.power/2);if(e.hp>0){e.el.querySelector('.hp i').style.width=(e.hp/e.max*100)+'%';navigator.vibrate?.(15);return}const now=performance.now();combo=now-lastKill<1600?combo+1:1;lastKill=now;const mult=1+Math.floor(combo/5);score+=types[e.kind].pts*mult;kills++;gauge=Math.min(100,gauge+12+up.power*3);$('score').textContent=score;$('gauge').textContent=gauge+'%';$('spray').disabled=gauge<100;$('combo').textContent='COMBO ×'+combo;$('combo').classList.add('on');setTimeout(()=>$('combo').classList.remove('on'),180);particles(x,y);if(e.kind==='boss')showAlert('BOSS撃破');remove(e);navigator.vibrate?.(10)}function damage(why){hearts--;combo=0;renderHearts();navigator.vibrate?.(180);showAlert(why);if(hearts<=0)end(false)}function renderHearts(){$('hearts').textContent='❤️'.repeat(hearts)+'🖤'.repeat(Math.max(0,3+up.heart-hearts))}function showAlert(t){const a=document.createElement('div');a.className='alert';a.textContent=t;arena.appendChild(a);setTimeout(()=>a.remove(),650)}
function choose(elapsed){const r=Math.random();if(elapsed>18&&r<.10)return'bomb';if(elapsed>22&&r<.24)return'ghost';if(elapsed>12&&r<.43)return'armor';if(elapsed>6&&r<.68)return'fast';return'normal'}function tick(now=performance.now()){if(!running)return;const elapsed=(now-startAt)/1000,left=Math.max(0,duration-elapsed);$('time').textContent=Math.ceil(left);if(left<=0)return end(true);if(!bossSpawned&&elapsed>=30){bossSpawned=true;showAlert('BOSS襲来');spawn('boss')}if(now>=nextSpawn){spawn(choose(elapsed));nextSpawn=now+Math.max(290,850-elapsed*7)}enemies.slice().forEach(e=>{const age=now-e.born;if(age>types[e.kind].life){remove(e);if(e.kind!=='bomb')damage('蚊を逃した')}});raf=requestAnimationFrame(tick)}
function start(){document.querySelectorAll('.enemy').forEach(x=>x.remove());enemies=[];score=0;kills=0;combo=0;gauge=0;bossSpawned=false;duration=60+up.time*5;hearts=3+up.heart;$('score').textContent=0;$('coin').textContent=wallet;$('gauge').textContent='0%';$('spray').disabled=true;renderHearts();$('intro').hidden=true;$('result').hidden=true;running=true;startAt=performance.now();nextSpawn=startAt+300;raf=requestAnimationFrame(tick);gtag?.('event','game_start',{game_name:'mosquito_survival'})}function end(survived){if(!running)return;running=false;cancelAnimationFrame(raf);enemies.forEach(remove);const earned=Math.floor(score/100)+(survived?5:0);wallet+=earned;save();const best=Math.max(score,Number(localStorage.mosqBest||0));localStorage.mosqBest=best;$('resultTitle').textContent=survived?'生還。':'全滅。';$('final').textContent=score;$('best').textContent=best;$('kills').textContent=kills;$('earned').textContent='+'+earned;$('result').hidden=false;gtag?.('event','game_finish',{game_name:'mosquito_survival',score,kills,survived})}
arena.addEventListener('pointerdown',ev=>{const el=ev.target.closest('.enemy');if(!el||!running)return;ev.preventDefault();const e=enemies.find(x=>x.id===Number(el.dataset.id));if(e){const r=arena.getBoundingClientRect();hit(e,ev.clientX-r.left,ev.clientY-r.top)}});$('spray').onclick=()=>{if(!running||gauge<100)return;gauge=0;$('gauge').textContent='0%';$('spray').disabled=true;enemies.slice().filter(e=>e.kind!=='boss'&&e.kind!=='bomb').forEach(e=>hit(e,arena.clientWidth-50,arena.clientHeight-50));showAlert('全滅スプレー')};document.querySelectorAll('.upgrade').forEach(b=>b.onclick=()=>{const k=b.dataset.up,cost=20+up[k]*25;if(wallet>=cost&&up[k]<3){wallet-=cost;up[k]++;save();menu()}});$('start').onclick=start;$('retry').onclick=start;$('menu').onclick=menu;menu()})();
</script></body></html>
